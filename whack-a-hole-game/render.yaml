services:
  - type: web
    name: whackamole-backend
    runtime: docker
    dockerfilePath: ./Dockerfile        # relative to repo root (whack-a-hole-game/)
    region: oregon
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false          # paste your Clever Cloud JDBC URL in Render dashboard
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false          # paste your Netlify URL e.g. https://yourapp.netlify.app
      - key: PORT
        value: "8080"
