services:
  - type: web
    name: whackamole-backend
    runtime: docker
    dockerfilePath: ./Dockerfile   # relative to rootDir below
    dockerContext: .               # build context = rootDir
    region: oregon
    plan: free
    rootDir: whack-a-hole-game     # tells Render to cd into this folder first
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: "8080"
