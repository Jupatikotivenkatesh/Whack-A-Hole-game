# ── Database ──────────────────────────────────────────────────────────────────
# Render injects SPRING_DATASOURCE_URL / USERNAME / PASSWORD as env vars.
# The fallback values (after :) are used for local development only.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/whackamole_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Server ────────────────────────────────────────────────────────────────────
# Render injects PORT automatically
server.port=${PORT:8080}

# ── Static resources (frontend served from JAR) ───────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ── Connection pool ───────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Give DB up to 60s to become available on cold start (Render free tier)
spring.datasource.hikari.initialization-fail-timeout=60000
